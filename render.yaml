# Render blueprint — deploy via: New + > Blueprint (connect this repo).
# Env vars are NOT stored here; set them in the Render dashboard (sync: false).
services:
  - type: web
    name: 4je
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_NOTIFY_SECRET
        sync: false
